packages:
  - apps/*
  - packages/*

# Versions every app and package must agree on. Reference them with
# "catalog:" in package.json so an SDK upgrade happens in one place.
catalog:
  expo: ~55.0.26
  react: 19.2.0
  react-dom: 19.2.0
  react-native: 0.83.6
  react-native-gesture-handler: ~2.30.1
  react-native-reanimated: ~4.2.1
  react-native-safe-area-context: ~5.6.0
  react-native-screens: ~4.23.0
  react-native-worklets: 0.7.4
  nativewind: ^4.2.1
  tailwindcss: 3.4.4
  typescript: ~5.9.2
  '@types/react': ~19.2.16
